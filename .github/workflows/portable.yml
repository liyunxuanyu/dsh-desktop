name: Portable desktop packages

# Builds and *runs* the "便捷包" (self-contained, unzip-and-run) desktop artifacts:
#   Windows x64 → DSH-Desktop-<version>-x64-Portable.zip  (win-portable target)
#   Linux x64   → DSH-NEXT-<version>-linux-x64-portable.tar.gz
#
# Windows must run on a native Windows host: package-win.ts rejects any other platform,
# because electron-builder rewrites the executable's resources with rcedit.

on:
  workflow_dispatch:
  push:
    branches:
      - portable/next
    tags:
      - 'v*-next*'

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Pin the Next upstream runtime
        shell: bash
        run: |
          set -euo pipefail
          commit=$(node -p "require('./upstream.json').channels.next.commit")
          git -C deepseek-harness fetch --depth 1 origin "$commit"
          git -C deepseek-harness checkout -q "$commit"
      - run: yarn install --immutable
      - name: Prepare the Electron binary
        # .yarnrc.yml disables package scripts, so Electron's postinstall never ran.
        shell: bash
        run: node dsh-desktop-next/node_modules/electron/install.js
      - name: Build the shared market and the Next bundles
        shell: bash
        run: |
          yarn workspace dsh-community-market build
          yarn workspace dsh-desktop-next build
      - name: Package the portable archive
        shell: bash
        # No store override: release archives must be compressed (store made the zip 1.6 GB).
        run: yarn workspace dsh-desktop-next dist:win-portable
      - name: Unpack the artifact and add the portable shell
        shell: pwsh
        run: |
          $zip = Get-ChildItem dsh-desktop-next/dist/*.zip | Select-Object -First 1
          $pkg = Join-Path $env:RUNNER_TEMP 'dsh-next-portable'
          Expand-Archive -Path $zip.FullName -DestinationPath $pkg
          Copy-Item dsh-desktop-next/portable/* $pkg -Recurse -Force
          "DSH_PKG=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Seed the offline registry
        shell: pwsh
        run: |
          $pkg = $env:DSH_PKG
          $node = Join-Path $pkg 'resources/runtime/x64/primary-runtime/dependencies/node/bin/node.exe'
          $pnpm = Join-Path $pkg 'resources/app.asar.unpacked/node_modules/pnpm/bin/pnpm.mjs'
          if (-not (Test-Path $node)) { throw "bundled node missing: $node" }
          if (-not (Test-Path $pnpm)) { throw "bundled pnpm missing: $pnpm" }
          $store = Join-Path $pkg 'registry/store'
          $cache = Join-Path $pkg 'registry/cache'
          New-Item -ItemType Directory -Force -Path $store, $cache, (Join-Path $pkg 'home') | Out-Null
          $specs = @((node -e "const m=require('./dsh-desktop-next/package.json');const d=m.dependencies;console.log(m.dsh.portableBundles.map(n=>n+'@'+(d[n]??'latest')).join(' '))").Split(' '))
          Write-Host "preinstalled plugins: $($specs -join ', ')"
          $scratch = Join-Path $env:RUNNER_TEMP 'store-seed'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          '{"name":"store-seed","private":true}' | Set-Content (Join-Path $scratch 'package.json')
          Push-Location $scratch
          # Same trap as on Linux: the store must be seeded through a real resolution, not store add.
          # PowerShell passes an unevaluated `--flag=(Join-Path …)` through literally, so interpolate.
          & $node $pnpm add --store-dir $store "--config.cacheDir=$cache" @specs
          Pop-Location
          if (-not (Test-Path (Join-Path $store 'v11'))) { throw 'registry store was not populated' }
          if (-not (Test-Path (Join-Path $cache 'v12/metadata'))) { throw 'registry metadata cache was not populated' }
          & npm pack --silent --pack-destination (Join-Path $pkg 'registry') @specs
          Get-ChildItem (Join-Path $pkg 'registry')
      - name: Assert the preinstalled plugins travel with the package
        shell: pwsh
        run: |
          $pkg = $env:DSH_PKG
          foreach ($name in @('dsh-ops', '@liustack/modsearch')) {
            $manifest = Join-Path $pkg "resources/app.asar.unpacked/node_modules/$name/package.json"
            if (-not (Test-Path $manifest)) { throw "preinstalled plugin missing from the payload: $name" }
            Write-Host "preinstalled: $name"
          }
          $runtime = Join-Path $pkg 'resources/runtime/x64/primary-runtime/runtime.json'
          if (-not (Test-Path $runtime)) { throw 'bundled interpreter payload missing' }
          Get-Content $runtime | ConvertFrom-Json | Format-List node, pnpm, python
      - name: Check the portable data root stays inside the package
        shell: pwsh
        run: |
          $pkg = $env:DSH_PKG
          $exe = (Get-ChildItem $pkg -Filter *.exe | Where-Object { $_.Name -notmatch 'chrome|crash|cff' } | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 60
          try {
            if (-not (Test-Path (Join-Path $pkg 'home/data'))) { throw 'portable.json was ignored: the package wrote no home/data' }
            if (Test-Path (Join-Path $env:APPDATA 'DSH NEXT/home')) { throw 'the package wrote outside itself (APPDATA/DSH NEXT/home)' }
            Get-ChildItem (Join-Path $pkg 'home/data') | Select-Object -First 10 | ForEach-Object { $_.Name }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-next-portable-win-x64
          path: dsh-desktop-next/dist/*.zip
          if-no-files-found: error

  linux-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Pin the Next upstream runtime
        run: |
          set -euo pipefail
          commit=$(node -p "require('./upstream.json').channels.next.commit")
          git -C deepseek-harness fetch --depth 1 origin "$commit"
          git -C deepseek-harness checkout -q "$commit"
      - run: yarn install --immutable
      - name: Prepare the Electron binary
        # .yarnrc.yml disables package scripts, so Electron's postinstall never ran.
        shell: bash
        run: node dsh-desktop-next/node_modules/electron/install.js
      - name: Build the shared market and the Next bundles
        run: |
          yarn workspace dsh-community-market build
          yarn workspace dsh-desktop-next build
      - name: UI onboarding smoke (real frontend, headless Chromium)
        run: |
          set -euo pipefail
          node dsh-desktop-next/node_modules/playwright/cli.js install chromium-headless-shell
          yarn workspace dsh-desktop-next verify:onboarding
      - name: Package the unpacked application
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-desktop-next package:dir
      - name: Add the portable shell and the offline registry
        run: |
          set -euo pipefail
          pkg="$(pwd)/dsh-desktop-next/dist/linux-unpacked"
          cp -a dsh-desktop-next/portable/. "$pkg"/
          mkdir -p "$pkg/registry/store" "$pkg/registry/cache" "$pkg/home"
          test -f "$pkg/registry/README.md" || { echo 'registry README missing from the package'; exit 1; }
          node_bin="$pkg/resources/runtime/x64/primary-runtime/dependencies/node/bin/node"
          pnpm_mjs="$pkg/resources/app.asar.unpacked/node_modules/pnpm/bin/pnpm.mjs"
          # The preinstalled bundle list is data, not code: dsh.portableBundles plus the versions
          # in package.json decide what the offline store and the registry carry.
          # Absolute paths: the fix below enters a scratch directory before invoking pnpm.
          specs=$(node -e "const m=require('./dsh-desktop-next/package.json');const d=m.dependencies;console.log(m.dsh.portableBundles.map(n=>n+'@'+(d[n]??'latest')).join(' '))")
          echo "preinstalled plugins: $specs"
          # `pnpm store add` stores only the named packages, not their dependency closure, so an
          # offline install would miss commander/undici. A scratch `pnpm add` resolves the closure
          # into the same store.
          scratch=$(mktemp -d)
          printf '{"name":"store-seed","private":true}\n' > "$scratch/package.json"
          # The metadata cache must travel with the store: offline range resolution (commander@^13)
          # reads it, and a clean machine has none.
          ( cd "$scratch" && "$node_bin" "$pnpm_mjs" add --store-dir "$pkg/registry/store" --config.cacheDir="$pkg/registry/cache" $specs )
          rm -rf "$scratch"
          # Guard the trap that bit us twice: a relative --store-dir inside the scratch cd wrote the
          # store into /tmp and deleted it, leaving an offline install that cannot resolve deps.
          test -d "$pkg/registry/store/v11" || { echo 'registry store was not populated'; exit 1; }
          test -d "$pkg/registry/cache/v12/metadata" || { echo 'registry metadata cache was not populated'; exit 1; }
          npm pack --silent --pack-destination "$pkg/registry" $specs
          echo "SPECS=$specs" >> "$GITHUB_ENV"
      - name: Pack the standalone offline plugin bundle
        run: |
          set -euo pipefail
          version=$(node -p "require('./dsh-desktop-next/package.json').version")
          pkg="$(pwd)/dsh-desktop-next/dist/linux-unpacked"
          node_bin="$pkg/resources/runtime/x64/primary-runtime/dependencies/node/bin/node"
          pnpm_mjs="$pkg/resources/app.asar.unpacked/node_modules/pnpm/bin/pnpm.mjs"
          out="$(pwd)/offline/plugins-offline"
          mkdir -p "$out/store" "$out/cache"
          scratch=$(mktemp -d)
          printf '{"name":"store-seed","private":true}\n' > "$scratch/package.json"
          ( cd "$scratch" && "$node_bin" "$pnpm_mjs" add --store-dir "$out/store" --config.cacheDir="$out/cache" $SPECS )
          rm -rf "$scratch"
          test -d "$out/store/v11" || { echo 'offline store was not populated'; exit 1; }
          test -d "$out/cache/v12/metadata" || { echo 'offline metadata cache was not populated'; exit 1; }
          npm pack --silent --pack-destination "$out" $SPECS
          cp dsh-desktop-next/portable/install-plugins.sh dsh-desktop-next/portable/install-plugins.cmd "$out"/
          node -e "const m=require('./dsh-desktop-next/package.json');const d=m.dependencies;require('fs').writeFileSync(process.argv[1], JSON.stringify({version: m.version, plugins: m.dsh.portableBundles.map(n=>({name:n, version:d[n]??'latest'}))}, null, 2)+'\\n')" "$out/plugins.json"
          cat "$out/plugins.json"
          {
            echo "# 离线插件包 $version"
            echo
            echo "把本目录放到便捷包旁边（或任意位置），先启动一次便捷包生成 Profile，然后运行："
            echo
            echo '    ./install-plugins.sh            # Linux'
            echo '    install-plugins.cmd             # Windows'
            echo
            echo "脚本用包内 node + pnpm 从 store/ 离线安装，插件清单：$SPECS"
          } > "$out/README.md"
          tar -czf "DSH-NEXT-${version}-offline-plugins.tar.gz" -C offline plugins-offline
          du -sh "DSH-NEXT-${version}-offline-plugins.tar.gz"
      - name: Launch the real window under Xvfb and check the portable data root
        run: |
          set -euo pipefail
          pkg=dsh-desktop-next/dist/linux-unpacked
          xvfb-run -a "$pkg/dsh-desktop-next" --no-sandbox --disable-gpu > /tmp/app.log 2>&1 &
          sleep 60
          test -d "$pkg/home/data" || { echo 'portable.json ignored: no home/data'; cat /tmp/app.log; exit 1; }
          test ! -d "$HOME/.dsh/profiles" || { echo 'wrote ~/.dsh despite portable marker'; exit 1; }
          ls "$pkg/home/data"
          pkill -f dsh-desktop-next || true
      - name: Install the offline bundle into a scratch profile
        run: |
          set -euo pipefail
          pkg="$(pwd)/dsh-desktop-next/dist/linux-unpacked"
          profile="$pkg/home/data/profiles/desktop"
          mkdir -p "$profile"
          printf '{"name":"probe","private":true,"dsh":{"profile":{"bundles":[]}}}\n' > "$profile/package.json"
          DSH_NEXT_PACKAGE="$pkg" DSH_DESKTOP_NEXT_HOME="$pkg/home/data" \
            sh "$(pwd)/offline/plugins-offline/install-plugins.sh" "$(pwd)/offline/plugins-offline"
          node -e "const d=require('$profile/package.json'); if (!d.dependencies || !d.dependencies['dsh-ops']) throw new Error('offline install produced no dependencies'); console.log('offline install ok:', Object.keys(d.dependencies).join(', '))"
          ls "$profile/node_modules"
          rm -rf "$pkg/home/data"
      - name: Archive the application directory
        run: |
          set -euo pipefail
          version=$(node -p "require('./dsh-desktop-next/package.json').version")
          tar -czf "DSH-NEXT-${version}-linux-x64-portable.tar.gz" -C dsh-desktop-next/dist linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-next-portable-linux-x64
          path: |
            DSH-NEXT-*-linux-x64-portable.tar.gz
            DSH-NEXT-*-offline-plugins.tar.gz
          if-no-files-found: error

  release:
    # A tag is the release trigger: both platform jobs must pass first, then the
    # verified archives are attached to one GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable, linux-portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dsh-desktop-next/portable
          persist-credentials: false
      - name: Fetch the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -D dist
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          # The verifier ships next to the checksums so a download can be checked without the repo.
          cp dsh-desktop-next/portable/verify-download.sh dsh-desktop-next/portable/verify-download.cmd \
             dsh-desktop-next/portable/verify-download.ps1 out/
          cd out && sha256sum *.zip *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt && du -sh .
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH NEXT 便捷包 $GITHUB_REF_NAME" \
            --notes "自包含桌面便捷包：数据目录随包、预装 dsh-ops 与 modsearch、内置离线 pnpm store。Windows 与 Linux 产物均在各自原生 runner 上完成打包与启动校验。"
